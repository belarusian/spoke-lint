[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spoke-lint"
version = "0.1.0"
description = "Static validator for four pipeline runner prompts: diffs spoke invocations against spoke argparse signatures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
spoke-lint = "spoke_lint.cli:main"

[tool.setuptools]
packages = ["spoke_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"
